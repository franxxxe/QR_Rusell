<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rusell & Jan | Wedding Invitation</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:
            linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.85)),
            url('https://images.unsplash.com/photo-1520854221256-17451cc331bf?q=80&w=1600&auto=format&fit=crop');
        background-size:cover;
        background-position:center;
        font-family:'Montserrat', sans-serif;
    }

    .card{
        width:90%;
        max-width:420px;
        background:rgba(255,255,255,0.92);
        backdrop-filter:blur(5px);
        border-radius:20px;
        padding:35px 25px;
        text-align:center;
        box-shadow:0 10px 30px rgba(0,0,0,0.1);
        border:1px solid rgba(191,163,122,0.3);
    }

    .title{
        font-size:12px;
        letter-spacing:4px;
        color:#a08b6a;
        text-transform:uppercase;
        margin-bottom:10px;
    }

    h1{
        font-family:'Cormorant Garamond', serif;
        font-size:40px;
        margin:5px 0;
        font-weight:400;
        color:#2f2f2f;
    }

    .and{
        color:#bfa37a;
        font-size:22px;
        margin:5px 0;
    }

    .date{
        margin-top:10px;
        font-size:14px;
        color:#666;
    }

    #qrcode{
        margin-top:25px;
        display:flex;
        justify-content:center;
    }

    .note{
        font-size:12px;
        margin-top:15px;
        color:#888;
    }

    .line{
        width:60px;
        height:1px;
        background:#bfa37a;
        margin:15px auto;
    }
</style>

</head>
<body>

<div class="card">

    <div class="title">Wedding Invitation</div>

    <h1>Rusell</h1>
    <div class="and">&</div>
    <h1>Jan</h1>

    <div class="line"></div>

    <div class="date">July 18, 2026</div>

    <div id="qrcode"></div>

    <div class="note">
        Scan to view full invitation
    </div>

</div>

<script>
new QRCode(document.getElementById("qrcode"), {
    text: "https://franxxxe.github.io/QR_Rusell/index.html",
    width: 180,
    height: 180,
    colorDark: "#2f2f2f",
    colorLight: "#ffffff",
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Invitation | Rusell & Jan</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Montserrat', sans-serif;
            background:#f8f5f1;
            color:#3d3d3d;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .card{
            width:100%;
            max-width:700px;
            background:white;
            border-radius:24px;
            padding:60px 40px;
            text-align:center;
            box-shadow:0 10px 40px rgba(0,0,0,0.08);
            position:relative;
            overflow:hidden;
        }

        .top-line,
        .bottom-line{
            width:80px;
            height:1px;
            background:#bfa37a;
            margin:0 auto 25px;
        }

        .bottom-line{
            margin:30px auto 0;
        }

        .invite{
            letter-spacing:4px;
            font-size:12px;
            text-transform:uppercase;
            color:#9b8a74;
            margin-bottom:20px;
        }

        h1{
            font-family:'Cormorant Garamond', serif;
            font-size:68px;
            font-weight:400;
            line-height:1.1;
            color:#2f2f2f;
        }

        .and{
            font-size:28px;
            margin:10px 0;
            color:#bfa37a;
            font-family:'Cormorant Garamond', serif;
        }

        .message{
            margin-top:35px;
            line-height:1.9;
            font-size:15px;
            color:#666;
        }

        .date{
            margin-top:40px;
            font-family:'Cormorant Garamond', serif;
            font-size:34px;
            color:#2f2f2f;
        }

        .year{
            margin-top:5px;
            letter-spacing:3px;
            color:#9b8a74;
            font-size:13px;
        }

        .footer{
            margin-top:45px;
            font-size:13px;
            color:#777;
            line-height:1.8;
        }

        /* BUTTON STYLE */
        .download-btn{
            margin-top:35px;
            display:inline-block;
            padding:12px 25px;
            background:#2f2f2f;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-size:14px;
            letter-spacing:1px;
            transition:0.3s;
        }

        .download-btn:hover{
            background:#bfa37a;
        }

        @media(max-width:600px){
            .card{
                padding:45px 25px;
                border-radius:18px;
            }

            h1{
                font-size:48px;
            }

            .date{
                font-size:28px;
            }

            .message{
                font-size:14px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="top-line"></div>

        <div class="invite">
            Wedding Invitation
        </div>

        <h1>Rusell</h1>

        <div class="and">&</div>

        <h1>Jan</h1>

        <div class="message">
            Together with their families,<br>
            joyfully invite you to celebrate<br>
            their wedding day.
        </div>

        <div class="date">
            July 18
        </div>

        <div class="year">
            2026
        </div>

        <div class="footer">
            We would be honored<br>
            to have you with us on this special day.
        </div>

        <!-- DOWNLOAD BUTTON -->
        <a class="download-btn"
           href="./Rusell_File.pdf"
           download="Rusell_File.pdf">
           Download Invitation PDF
        </a>

        <div class="bottom-line"></div>

    </div>

</body>
</html>
